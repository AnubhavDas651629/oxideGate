[package]
name = "oxidegate"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
